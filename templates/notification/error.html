<!doctype html>
<html lang="en">
    <head>
        <title>Riwayat Sistem Error | Water Level System</title>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui"
        />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        

        <script src="https://unpkg.com/lucide@latest"></script>
        <link
            rel="stylesheet"
            href="/assets/fonts/inter/inter.css"
            id="main-font-link"
        />
        <link rel="stylesheet" href="/assets/fonts/tabler-icons.min.css" />
        <link rel="stylesheet" href="/assets/fonts/feather.css" />
        <link rel="stylesheet" href="/assets/fonts/fontawesome.css" />
        <link rel="stylesheet" href="/assets/fonts/material.css" />
        <link
            rel="stylesheet"
            href="/assets/css/style.css?v=174"
            id="main-style-link"
        />
        <link rel="stylesheet" href="/assets/css/style-preset.css" />

        <style>
            /* Fix untuk ukuran icon Lucide agar menyesuaikan dengan container / font-size */
            .lucide {
                width: 1em !important;
                height: 1em !important;
            }
        </style>
    <link rel="icon" href="data:,">
    </head>
    <body
        data-pc-preset="preset-1"
        data-pc-sidebar-caption="true"
        data-pc-layout="vertical"
        data-pc-direction="ltr"
        data-pc-theme_contrast=""
        data-pc-theme="light"
    >
        <div class="loader-bg">
            <div class="loader-track">
                <div class="loader-fill"></div>
            </div>
        </div>
        <div id="sidebar-container"></div>
        <div id="header-container"></div>
        <div class="pc-container">
            <div class="pc-content">
                
                <div class="row">
                    <div class="col-sm-12">
                        <div class="card">
                            <div class="card-body p-4 pb-3">
                                <!-- Unified Toolbar -->
                                <div
                                    class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3 mb-4"
                                >
                                    <!-- Left Side: Title & Row Limit -->
                                    <div
                                        class="d-flex flex-wrap align-items-center gap-3"
                                    >
                                        <h5
                                            class="mb-0 fw-bold d-none d-md-block"
                                        >
                                            Riwayat Sistem Error
                                        </h5>
                                    </div>

                                    <!-- Right Side -->
                                    <div
                                        class="d-flex align-items-center gap-2 align-self-end align-self-sm-auto ms-auto"
                                    >
                                        <!-- Filter (Dropdown) -->
                                        <div class="dropdown flex-shrink-0">
                                            <button
                                                class="btn btn-sm bg-transparent border-0 text-secondary p-1 shadow-none"
                                                type="button"
                                                data-bs-toggle="dropdown"
                                                aria-expanded="false"
                                                data-bs-auto-close="outside"
                                                title="Filter Lanjutan"
                                            >
                                                <i
                                                    data-lucide="sliders-horizontal"
                                                    style="
                                                        width: 20px;
                                                        height: 20px;
                                                    "
                                                ></i>
                                            </button>
                                            <div
                                                class="dropdown-menu dropdown-menu-end p-3 shadow-lg border-0"
                                                style="
                                                    width: 280px;
                                                    max-width: 90vw;
                                                    box-shadow: 0 4px 15px
                                                        rgba(0, 0, 0, 0.1) !important;
                                                "
                                            >
                                                <h6
                                                    class="dropdown-header px-0 text-dark fw-bold mb-1"
                                                >
                                                    Jumlah Baris
                                                </h6>
                                                <select
                                                    id="filter-limit"
                                                    class="form-select form-select-sm mb-3 shadow-none"
                                                >
                                                    <option value="10" selected>
                                                        10 Baris
                                                    </option>
                                                    <option value="25">
                                                        25 Baris
                                                    </option>
                                                    <option value="50">
                                                        50 Baris
                                                    </option>
                                                    <option value="100">
                                                        100 Baris
                                                    </option>
                                                </select>
                                                <h6
                                                    class="dropdown-header px-0 text-dark fw-bold mb-1"
                                                >
                                                    Status Sistem
                                                </h6>
                                                <select
                                                    id="filter-status"
                                                    class="form-select form-select-sm mb-3 shadow-none"
                                                >
                                                    <option>
                                                        Semua Status
                                                    </option>
                                                    <option>Online</option>
                                                    <option>Warning</option>
                                                    <option>Offline</option>
                                                </select>
                                                <button
                                                    id="btn-apply-filter"
                                                    class="btn btn-primary btn-sm w-100"
                                                >
                                                    Terapkan
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Search -->
                                        <div
                                            class="position-relative"
                                            style="max-width: 200px"
                                        >
                                            <i
                                                data-lucide="search"
                                                class="position-absolute text-muted"
                                                style="
                                                    left: 10px;
                                                    top: 50%;
                                                    transform: translateY(-50%);
                                                    width: 14px;
                                                    height: 14px;
                                                "
                                            ></i>
                                            <input
                                                id="filter-search"
                                                type="text"
                                                class="form-control form-control-sm shadow-none border"
                                                style="
                                                    padding-left: 32px;
                                                    border-radius: 6px;
                                                "
                                                placeholder="Cari..."
                                            />
                                        </div>
                                    </div>
                                </div>
                                <!-- End Toolbar -->

                                <style>
                                    .table-flush-edges th:first-child,
                                    .table-flush-edges td:first-child {
                                        border-left: none !important;
                                        padding-left: 1.5rem !important;
                                    }
                                    .table-flush-edges th:last-child,
                                    .table-flush-edges td:last-child {
                                        border-right: none !important;
                                        padding-right: 1.5rem !important;
                                    }
                                </style>
                                <div class="table-responsive">
                                    <table
                                        class="table table-hover table-flush-edges mb-0 table-mobile-cards error-table"
                                    >
                                        <thead class="table-light">
                                            <tr
                                                class="text-muted"
                                                style="
                                                    font-size: 0.75rem;
                                                    letter-spacing: 0.5px;
                                                "
                                            >
                                                <th
                                                    class="text-center"
                                                    style="width: 50px"
                                                >
                                                    No
                                                </th>
                                                <th
                                                    class="text-center d-none d-md-table-cell"
                                                >
                                                    Tanggal
                                                </th>
                                                <th
                                                    class="text-center d-none d-md-table-cell"
                                                >
                                                    Pukul
                                                </th>
                                                <th
                                                    class="text-center d-md-none"
                                                >
                                                    Waktu
                                                </th>
                                                <th>Pesan Error</th>
                                                <th class="text-center">
                                                    Status Alat
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody
                                            id="system-error-table-body"
                                        ></tbody>
                                    </table>
                                </div>
                                <div class="card-footer bg-white pt-4 pb-3">
                                    <div
                                        class="d-flex flex-column flex-md-row align-items-center justify-content-center justify-content-md-between text-center gap-3"
                                    >
                                        <span
                                            class="text-muted small"
                                            id="system-error-table-info"
                                            >Memuat riwayat sistem
                                            error...</span
                                        >
                                        <nav aria-label="Navigasi Halaman">
                                            <ul
                                                id="pagination-container"
                                                class="pagination pagination-sm mb-0"
                                            >
                                                <!-- Disuntik via JS -->
                                            </ul>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="modal fade"
                id="detailErrorModal"
                tabindex="-1"
                aria-labelledby="detailErrorModalLabel"
                aria-hidden="true"
            >
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div
                        class="modal-content shadow-lg border-0"
                        style="border-radius: 16px"
                    >
                        <div class="modal-header border-bottom-0 pb-0">
                            <h5
                                class="modal-title fw-bold"
                                id="detail-error-title"
                            >
                                Detail Sistem Error
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"
                            ></button>
                        </div>
                        <div class="modal-body">
                            <div class="d-flex flex-column gap-3">
                                <div class="border-bottom pb-2">
                                    <small
                                        class="text-muted d-block text-uppercase fw-bold mb-1"
                                        style="font-size: 0.7rem"
                                        >Tanggal</small
                                    >
                                    <span
                                        class="fw-medium text-dark"
                                        id="detail-error-tanggal"
                                        >-</span
                                    >
                                </div>
                                <div class="border-bottom pb-2">
                                    <small
                                        class="text-muted d-block text-uppercase fw-bold mb-1"
                                        style="font-size: 0.7rem"
                                        >Pukul</small
                                    >
                                    <span
                                        class="fw-medium text-dark"
                                        id="detail-error-pukul"
                                        >-</span
                                    >
                                </div>
                                <div class="border-bottom pb-2">
                                    <small
                                        class="text-muted d-block text-uppercase fw-bold mb-1"
                                        style="font-size: 0.7rem"
                                        >Status Sistem</small
                                    >
                                    <div id="detail-error-badge"></div>
                                </div>
                                <div>
                                    <small
                                        class="text-muted d-block text-uppercase fw-bold mb-2"
                                        style="font-size: 0.7rem"
                                        >Pesan Error</small
                                    >
                                    <div
                                        class="bg-light p-3 rounded text-muted small"
                                        id="detail-error-log"
                                        style="
                                            font-family: monospace;
                                            white-space: pre-wrap;
                                            word-break: break-all;
                                        "
                                    >
                                        -
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer MUST be outside pc-container because pc-footer class handles its own sidebar margin -->
        <div id="footer-container"></div>
        <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>

        <script src="/static/js/api.js?v=174"></script>
        <script src="/static/js/pages/system_error.js?v=174"></script>
        <script src="/static/js/layout.js?v=174"></script>
        <script>
            lucide.createIcons();
        </script>
        <script src="/assets/js/plugins/apexcharts.min.js"></script>
        <script src="/assets/js/plugins/popper.min.js"></script>
        <script src="/assets/js/plugins/simplebar.min.js"></script>
        <script src="/assets/js/plugins/bootstrap.min.js"></script>
        <script src="/assets/js/fonts/custom-font.js"></script>
        <script src="/assets/js/script.js"></script>
        <script src="/assets/js/theme.js"></script>
        <script src="/assets/js/plugins/feather.min.js"></script>
        <script>
            if (typeof layout_caption_change === "function")
                layout_caption_change("true");
            if (typeof layout_rtl_change === "function")
                layout_rtl_change("false");
            if (typeof preset_change === "function") preset_change("preset-1");
        </script>
    </body>
</html>
