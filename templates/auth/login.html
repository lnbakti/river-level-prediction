<!doctype html>
<html lang="en">
    <head>
        <title>Login | Water Level System</title>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui"
        />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <script src="https://unpkg.com/lucide@latest"></script>
        <link
            rel="stylesheet"
            href="/assets/fonts/inter/inter.css"
            id="main-font-link"
        />
        <link rel="stylesheet" href="/assets/fonts/tabler-icons.min.css" />
        <link rel="stylesheet" href="/assets/fonts/feather.css" />
        <link rel="stylesheet" href="/assets/fonts/fontawesome.css" />
        <link rel="stylesheet" href="/assets/fonts/material.css" />
        <link
            rel="stylesheet"
            href="/assets/css/style.css?v=174"
            id="main-style-link"
        />
        <link rel="stylesheet" href="/assets/css/style-preset.css" />

        <style>
            /* Fix untuk ukuran icon Lucide agar menyesuaikan dengan container / font-size */
            .lucide {
                width: 1em !important;
                height: 1em !important;
            }
        </style>
    <link rel="icon" href="data:,">
    </head>
    <body
        data-pc-preset="preset-1"
        data-pc-sidebar-caption="true"
        data-pc-layout="vertical"
        data-pc-direction="ltr"
        data-pc-theme_contrast=""
        data-pc-theme="light"
    >
        <div class="loader-bg">
            <div class="loader-track">
                <div class="loader-fill"></div>
            </div>
        </div>
        <div class="auth-main">
            <div class="auth-wrapper v1">
                <div class="auth-form">
                    <div class="card shadow-sm my-5">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <div
                                    class="avtar avtar-l bg-light-primary rounded-circle mb-3 text-primary mx-auto d-none"
                                >
                                    <i data-lucide="log-in" class="fs-2"></i>
                                </div>
                                <h3 class="fw-bold mb-2">Login ke Dashboard</h3>
                                <p class="text-muted mb-0">
                                    Sistem Peringatan Dini Ketinggian Air
                                </p>
                                <div
                                    id="login-error"
                                    class="text-danger small mt-2 fw-bold hidden"
                                ></div>
                            </div>
                            <form id="login-form">
                                <div class="form-group mb-3">
                                    <label class="form-label"
                                        >Username / No. WhatsApp
                                        <span class="text-danger"
                                            >*</span
                                        ></label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="login-username"
                                        required
                                    />
                                </div>
                                <div class="form-group mb-4">
                                    <label class="form-label"
                                        >Password
                                        <span class="text-danger"
                                            >*</span
                                        ></label
                                    >
                                    <div class="position-relative">
                                        <input
                                            type="password"
                                            class="form-control pe-5"
                                            id="login-password"
                                            required
                                        />
                                        <span
                                            class="position-absolute top-50 end-0 translate-middle-y me-3 text-muted"
                                            style="cursor: pointer; z-index: 10"
                                            onclick="
                                                const p =
                                                    document.getElementById(
                                                        'login-password',
                                                    );
                                                if (p.type === 'password') {
                                                    p.type = 'text';
                                                    this.innerHTML =
                                                        '<i data-lucide=\'eye-off\' class=\'fs-5\'></i>';
                                                    lucide.createIcons();
                                                } else {
                                                    p.type = 'password';
                                                    this.innerHTML =
                                                        '<i data-lucide=\'eye\' class=\'fs-5\'></i>';
                                                    lucide.createIcons();
                                                }
                                            "
                                        >
                                            <i
                                                data-lucide="eye"
                                                class="fs-5"
                                            ></i>
                                        </span>
                                    </div>
                                </div>
                                <!-- Fitur Ingat Saya & Lupa Password disembunyikan sementara (tambahkan class d-none) -->
                                <div
                                    class="d-flex mt-1 justify-content-between align-items-center mb-4 d-none"
                                >
                                    <div class="form-check">
                                        <input
                                            class="form-check-input input-primary"
                                            type="checkbox"
                                            id="customCheckc1"
                                            checked=""
                                        />
                                        <label
                                            class="form-check-label text-muted"
                                            for="customCheckc1"
                                            >Ingat saya</label
                                        >
                                    </div>
                                    <a
                                        href="/forgot-password"
                                        class="text-primary fw-bold text-decoration-none"
                                        >Lupa Password?</a
                                    >
                                </div>
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100 fw-bold py-2 mb-4 shadow-sm"
                                    id="btn-login"
                                >
                                    Masuk
                                </button>
                                <div class="text-center">
                                    <p class="mb-0 text-muted">
                                        Belum punya akun?
                                        <a
                                            href="/register"
                                            class="text-primary fw-bold text-decoration-none"
                                            >Buat Akun Baru</a
                                        >
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/static/js/api.js?v=174"></script>
        <script src="/static/js/pages/auth.js?v=174"></script>
        <script>
            lucide.createIcons();
        </script>
        <script src="/assets/js/plugins/apexcharts.min.js"></script>
        <script src="/assets/js/plugins/popper.min.js"></script>
        <script src="/assets/js/plugins/simplebar.min.js"></script>
        <script src="/assets/js/plugins/bootstrap.min.js"></script>
        <script src="/assets/js/fonts/custom-font.js"></script>
        <script src="/assets/js/script.js"></script>
        <script src="/assets/js/theme.js"></script>
        <script src="/assets/js/plugins/feather.min.js"></script>
        <script>
            if (typeof layout_caption_change === "function")
                layout_caption_change("true");
            if (typeof layout_rtl_change === "function")
                layout_rtl_change("false");
            if (typeof preset_change === "function") preset_change("preset-1");
        </script>
    </body>
</html>
