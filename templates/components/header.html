<header class="pc-header">
    <div
        class="header-wrapper d-flex align-items-center justify-content-between"
    >
        <div class="d-flex align-items-center gap-1 gap-sm-2">
            <!-- Sidebar Hamburger Menu -->
            <a href="#" class="text-secondary d-none d-md-flex" id="sidebar-hide"
                style="cursor: pointer; padding: 6px; align-items: center; border-radius: 6px; text-decoration: none;"
                onmouseover="this.style.backgroundColor='#F3F4F6';"
                onmouseout="this.style.backgroundColor='transparent';"
            >
                <i class="ti ti-menu-2" style="font-size: 1.5rem; color: #4B5563;"></i>
            </a>
            <!-- Page Title injected by JS -->
            
            
            
            <!-- Page Title injected by JS -->
            <h4 id="header-page-title" class="m-0 ms-1 fw-bold text-dark text-truncate" style="font-size: 1.15rem; letter-spacing: -0.3px; max-width: 400px; color: #1E293B !important;"></h4>


        </div>

        <!-- Header Right Area (Time, Bell, Profile) -->
        <div class="d-flex align-items-center gap-1 gap-sm-2">
            <!-- System Time Clock -->
            <div
                class="d-flex align-items-center px-1 px-sm-2 py-1 rounded shadow-sm border"
                style="
                    background-color: #ffffff;
                    border-color: #e3e8ef !important;
                "
            >
                <i
                    class="ti ti-clock text-muted me-1"
                    style="font-size: clamp(0.85rem, 2.5vw, 1rem)"
                ></i>
                <div
                    class="fw-bold text-dark"
                    id="system-time"
                    style="
                        font-size: clamp(0.7rem, 2.5vw, 0.9rem);
                        font-variant-numeric: tabular-nums;
                        letter-spacing: 0.5px;
                    "
                >
                    --:--:--
                </div>
            </div>

            <ul
                class="list-unstyled d-flex align-items-center mb-0 gap-1 gap-sm-2"
            >
                <!-- Notification Bell -->
                <li
                    class="dropdown pc-h-item admin-only"
                    id="header-notification-item"
                >
                    <a
                        class="pc-head-link dropdown-toggle arrow-none me-0 d-flex align-items-center justify-content-center"
                        data-bs-toggle="dropdown"
                        data-bs-offset="0,15"
                        href="#"
                        role="button"
                        aria-haspopup="false"
                        aria-expanded="false"
                        style="width: 32px; height: 32px; border-radius: 50%"
                    >
                        <i class="ti ti-bell" style="font-size: 1.15rem"></i>
                        <span
                            class="badge bg-success pc-h-badge"
                            id="header-notification-badge"
                        ></span>
                    </a>
                    <div
                        class="dropdown-menu dropdown-notification dropdown-menu-end shadow-lg border-0"
                        style="border-radius: 12px; margin-top: 15px !important"
                    >
                        <div
                            class="dropdown-header d-flex align-items-center justify-content-between p-3 border-bottom"
                        >
                            <h5 class="m-0 fw-bold fs-6">Notifikasi</h5>
                            <a
                                href="#"
                                class="btn btn-link btn-sm p-0 text-decoration-none"
                                id="btn-mark-all-read"
                                >Tandai Semua Dibaca</a
                            >
                        </div>
                        <div
                            class="dropdown-body text-wrap header-notification-scroll position-relative"
                            style="max-height: 350px; overflow-y: auto"
                        >
                            <div id="header-notification-items"></div>
                            <div
                                id="header-notification-empty"
                                class="text-center text-muted py-4"
                            >
                                Tidak ada notifikasi terbaru.
                            </div>
                        </div>
                    </div>
                </li>

                <!-- Profile Dropdown -->
                <li class="dropdown pc-h-item" style="position: relative">
                    <a
                        class="dropdown-toggle arrow-none text-decoration-none d-flex align-items-center justify-content-center"
                        data-bs-toggle="dropdown"
                        data-bs-offset="0,15"
                        href="#"
                        role="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                        style="padding: 0; margin: 0; display: inline-flex"
                    >
                        <div
                            id="header-user-initial"
                            class="avtar bg-light-primary text-primary fw-bold rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                            style="
                                width: 32px;
                                height: 32px;
                                font-size: 1rem;
                                cursor: pointer;
                                border: 2px solid #eef2f6;
                                line-height: 1;
                                padding: 0;
                            "
                        >
                            ?
                        </div>
                    </a>
                    <div
                        class="dropdown-menu dropdown-menu-end shadow-lg border-0 dropdown-user-profile"
                        style="border-radius: 12px; margin-top: 15px !important"
                    >
                        <div
                            class="dropdown-header d-flex flex-row align-items-center justify-content-start p-3 border-bottom gap-2"
                        >
                            <div
                                id="dropdown-user-avatar"
                                class="avtar bg-light-primary text-primary fw-bold rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                                style="
                                    width: 40px;
                                    height: 40px;
                                    font-size: 1.1rem;
                                    flex-shrink: 0;
                                    border: 2px solid #eef2f6;
                                "
                            >
                                ?
                            </div>
                            <div
                                class="d-flex flex-column text-start"
                                style="overflow: hidden"
                            >
                                <h6
                                    class="mb-0 fw-bold"
                                    id="header-user-name"
                                    style="
                                        font-size: 0.95rem;
                                        white-space: nowrap;
                                        overflow: hidden;
                                        text-overflow: ellipsis;
                                        max-width: 120px;
                                    "
                                >
                                    Memuat...
                                </h6>
                                <small
                                    class="text-muted"
                                    id="header-user-role"
                                    style="
                                        font-size: 0.75rem;
                                        white-space: nowrap;
                                        overflow: hidden;
                                        text-overflow: ellipsis;
                                        max-width: 120px;
                                    "
                                    >Role</small
                                >
                            </div>
                        </div>
                        <div class="p-2">
                            <a
                                href="/profile"
                                class="dropdown-item py-2 px-3 rounded d-flex align-items-center mb-1"
                            >
                                <i class="ti ti-user me-2 fs-5"></i>
                                <span>Profil Saya</span>
                            </a>
                            <a
                                href="#!"
                                class="dropdown-item py-2 px-3 rounded text-danger d-flex align-items-center"
                                id="header-logout"
                            >
                                <i class="ti ti-power me-2 fs-5"></i>
                                <span>Keluar</span>
                            </a>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Modal Notifikasi Header -->
<div
    class="modal fade"
    id="headerNotificationModal"
    tabindex="-1"
    aria-labelledby="headerNotificationModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog mx-3 mx-sm-auto mt-5" style="max-width: 400px">
        <div
            class="modal-content shadow-lg border-0"
            style="border-radius: 16px"
        >
            <div class="modal-header border-bottom-0 pb-0">
                <h5
                    class="modal-title fw-bold"
                    id="headerNotificationModalLabel"
                >
                    Detail Notifikasi
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <div class="d-flex flex-column gap-3">
                    <div class="border-bottom pb-2">
                        <small
                            class="text-muted d-block text-uppercase fw-bold mb-1"
                            style="font-size: 0.7rem"
                            >Waktu</small
                        >
                        <div class="fw-bold text-dark" id="header-notif-time">
                            -
                        </div>
                    </div>
                    <div class="border-bottom pb-2">
                        <small
                            class="text-muted d-block text-uppercase fw-bold mb-1"
                            style="font-size: 0.7rem"
                            >Status</small
                        >
                        <div class="mt-1" id="header-notif-status">-</div>
                    </div>
                    <div>
                        <small
                            class="text-muted d-block text-uppercase fw-bold mb-1"
                            style="font-size: 0.7rem"
                            >Pesan</small
                        >
                        <div
                            class="text-dark"
                            id="header-notif-message"
                            style="font-size: 0.85rem"
                        >
                            -
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
